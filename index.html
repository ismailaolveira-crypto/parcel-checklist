<script>
const rows=JSON.parse(document.getElementById('parcel-data').textContent);
const unique=[...new Map(rows.map(r=>[r.tracking,r])).values()];
const key='parcel-checklist-2026-10-22-v1:'+document.title;
const checked=Object.fromEntries(unique.map(r=>[r.tracking,r.initialChecked]));
let canSave=true;
try{const saved=JSON.parse(localStorage.getItem(key)||'{}');for(const r of unique)if(typeof saved[r.tracking]==='boolean')checked[r.tracking]=saved[r.tracking];}catch{canSave=false;}
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=c=>'¥'+(c/100).toFixed(2);
function render(){
 const count=unique.filter(r=>checked[r.tracking]).length;
 el('stats').innerHTML=[[rows.length,'件物品 · '+unique.length+' 个包裹'],[unique.filter(r=>r.code).length,'个当前取件码'],[count+' / '+unique.length,'包裹已勾选'],[money(rows.reduce((a,r)=>a+r.cents,0)),'原清单商品总价']].map(([a,b])=>`<div class="stat"><strong>${a}</strong><span>${b}</span></div>`).join('');
 const missing=unique.filter(r=>r.status==='待取件'&&!r.code&&!r.note.includes('保护')).length;
 const protectedCount=unique.filter(r=>r.note.includes('保护')).length;
 const moving=unique.filter(r=>r.status==='运输中').length;
 const noInfo=unique.filter(r=>r.status.includes('暂无物流')).length;
 const signed=unique.filter(r=>r.status==='已签收').length;
 el('info').innerHTML='<p>全部单号已在菜鸟逐一核对。没有显示取件码，不代表包裹尚未到站。</p><div class="legend">'+[[missing,'已到代收点，页面无码'],[protectedCount,'取件码受保护'],[moving,'运输中'],[noInfo,'暂无物流'],[signed,'已签收']].filter(([n])=>n).map(([n,t])=>`<span>${n} 个 · ${t}</span>`).join('')+'</div>';
 el('save-state').textContent=canSave?'勾选会保存在当前浏览器的这份清单中；可随时取消。合包照片三行联动。':'此预览不支持持久保存；勾选在本次页面打开期间有效。建议下载后用浏览器打开。';
 const q=el('search').value.trim().toLowerCase(),f=el('filter').value;
 const visible=rows.filter(r=>[r.name,r.tracking,r.code,r.historicalCode,r.note,r.carrier].join(' ').toLowerCase().includes(q)).filter(r=>f==='all'||f==='unchecked'&&!checked[r.tracking]||f==='checked'&&checked[r.tracking]||f==='code'&&r.code||f==='missing'&&r.status==='待取件'&&!r.code||f==='moving'&&(r.status==='运输中'||r.status.includes('暂无物流'))||f==='signed'&&r.status==='已签收');
 el('tables').innerHTML=[1,2].map(g=>{
  const all=rows.filter(r=>r.group===g),list=visible.filter(r=>r.group===g);if(!all.length)return '';
  return `<section><div class="section-head"><h2>${g===1?'拼多多':'淘宝'}</h2><span>显示 ${list.length} / ${all.length} 项 · ${money(all.reduce((a,r)=>a+r.cents,0))}</span></div>${!list.length?'<div class="empty">没有符合当前筛选的物品</div>':`<div class="table-wrap"><table aria-label="${g===1?'拼多多':'淘宝'}取件表"><thead><tr><th class="check">已取</th><th class="item">具体物品 / 规格</th><th class="track">快递单号</th><th class="pickup">对应取件码</th><th class="price">物品价格</th><th>菜鸟状态 / 核对说明</th></tr></thead><tbody>${list.map(r=>`<tr class="${checked[r.tracking]?'checked':''}"><td class="check"><input type="checkbox" data-track="${r.tracking}" aria-label="已取：${esc(r.name)}" ${checked[r.tracking]?'checked':''}><small>${checked[r.tracking]?'已取':'# '+r.n}</small></td><td class="product"><div class="name">${esc(r.name)}</div></td><td class="tracking"><span class="tracknum">${r.tracking}</span><span class="carrier">${esc(r.carrier)}</span></td><td class="pickup-cell">${r.code?`<span class="code">${r.code}</span><span class="note">${r.carrier==='顺丰'?'三笔订单 · 同一个包裹':'uic新文化小镇菜鸟驿站'}</span>`:r.historicalCode?`<span class="no-code">历史取件码</span><span class="historic">${r.historicalCode}</span>`:`<span class="no-code">${r.note.includes('保护')?'取件码受保护':r.status==='已签收'?'已签收 · 页面未显示':r.status==='待取件'?'已到代收点 · 页面未显示':'尚无取件码'}</span>`}</td><td class="price-cell"><span class="amount">${money(r.cents)}</span></td><td class="status-cell"><span class="badge ${r.status==='待取件'?'wait':r.status==='运输中'?'travel':''}">${r.status}</span>${r.note?`<div class="note">${esc(r.note)}</div>`:''}</td></tr>`).join('')}</tbody></table></div>`}</section>`;
 }).join('');
}
el('tables').addEventListener('change',e=>{if(!e.target.matches('input[data-track]'))return;checked[e.target.dataset.track]=e.target.checked;try{localStorage.setItem(key,JSON.stringify(checked));canSave=true;}catch{canSave=false;}const track=e.target.dataset.track;render();el('tables').querySelector(`input[data-track="${track}"]`)?.focus({preventScroll:true});});
el('search').addEventListener('input',render);el('filter').addEventListener('change',render);el('print').addEventListener('click',()=>window.print());render();
</script></body></html>
